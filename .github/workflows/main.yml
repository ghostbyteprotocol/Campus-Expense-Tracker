name: Build & Release Campus Expense APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Prepare Custom Icon & Build Project
        run: |
          npm install --no-audit --no-fund
          npm install -D @capacitor/assets --no-audit --no-fund
          npm run build
          mkdir -p assets
          IMG_FILE=$(ls *.png *.PNG *.jpg *.JPG *.jpeg *.JPEG *.webp 2>/dev/null | head -n 1)
          if [ -n "$IMG_FILE" ]; then
            echo "Found custom image: $IMG_FILE"
            convert "$IMG_FILE" -resize 1024x1024! assets/icon-only.png
            cp assets/icon-only.png assets/icon-foreground.png
            cp assets/icon-only.png assets/splash.png
          else
            echo "No image found, creating fallback icon"
            convert -size 1024x1024 xc:'#1e1438' -fill '#f59e0b' -draw "circle 512,512 512,180" assets/icon-only.png
            cp assets/icon-only.png assets/icon-foreground.png
            cp assets/icon-only.png assets/splash.png
          fi
          rm -f capacitor.config.json capacitor.config.ts
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.ayan.campusexpense",
            "appName": "Campus Expense",
            "webDir": "www",
            "server": {
              "url": "https://ghostbyteprotocol.github.io/Campus-Expense-Tracker/",
              "cleartext": true
            }
          }
          EOF
          npx cap add android
          npx capacitor-assets generate --android --iconBackgroundColor '#09070e' --splashBackgroundColor '#09070e'
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          mv app/build/outputs/apk/debug/app-debug.apk ../Campus-Expense-Tracker.apk

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Campus Expense Tracker v1.0.${{ github.run_number }}
          body: "Updated with custom app icon."
          files: Campus-Expense-Tracker.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
