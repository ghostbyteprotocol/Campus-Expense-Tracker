name: Build Campus Expense APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Web & Android Project
        run: |
          npm install --no-audit --no-fund
          npm run build
          rm -f capacitor.config.json capacitor.config.ts
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.ayan.campusexpense",
            "appName": "Campus Expense",
            "webDir": "www",
            "server": {
              "url": "https://ghostbyteprotocol.github.io/Campus-Expense-Tracker/",
              "cleartext": true
            }
          }
          EOF
          npx cap add android
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Campus-Expense-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
